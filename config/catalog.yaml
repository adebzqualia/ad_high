    - 'Customer Service : Selfcare rate % (New Definition)'
    - 'Customer Service : Phone footprint Index (Agent Contact rate X Phone rate)'
    - 'Collection : Digital Interactions % (only interactive channels)'
    - 'Mobility : Ops Maturity Index'
    - 'Granting: Global Productivity Index'
