# Ordered business KPI labels and sheet aliases. Usually this file needs no edits.
# Repeated KPI labels are intentional: occurrence numbers are inferred from order.
# KPI identifiers come from the sent workbook; no old KPI-name catalogue is used.
# To audit an optional empty sheet, add its KPI labels here, then select it in settings.yaml.
version: 1
sheets:
  ID Card:
    aliases:
    - ID_Card
    kpis:
    - OUTSTANDING - Av. (M€)
    - o/w AUTO
    - o/W B2C
    - o/W B2B
    - o/W Others (*)
    - PRODUCTION (M€)
    - o/w AUTO
    - o/W B2C
    - o/W B2B
    - o/W Others (*)
    - OPENED ACCOUNTS (nb)
    - o/w AUTO
    - o/W B2C
    - o/W B2B
    - o/W Others (*)
    - ACTIVE ACCOUNTS - EoP (nb)
    - o/w AUTO
    - o/W B2C
    - o/W B2B
    - o/W Others (*)
    - NBI (M€)
    - NBI / Outstanding (%)
    - OPEX (M€)
    - OPEX / Outstanding (%)
    - CoR (M€)
    - CoR / Outstanding (%)
    - NIBT (M€)
    - Cost Income Ratio
    - RONE (%)
    - FTE - EoP
    - CVC OPS Rebased - Cost Base Vision (**) (M€)
    - CVC OPS 'Cost Base Vision' / Outstanding Av. (%)
    - CVC OPS Rebased - P&L Vision (M€)
    - CVC OPS 'P&L Vision' / Outstanding Av. (%)
  OBS KPI:
